services:
  resume-matcher:
    container_name: resume-matcher-app
    build:
      context: .
      dockerfile: Dockerfile
    image: resume-matcher:latest
    ports:
      - "8501:8501"
    # Uncomment the deploy block below to enable NVIDIA GPU acceleration
    # (Requires NVIDIA GPU & NVIDIA Container Toolkit installed on host machine)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      # Mount data, ChromaDB vector store, and SQLite database for host persistence
      - ./data:/app/data
      - ./models:/app/models
      - ./history.db:/app/history.db
    environment:
      - PYTHONUNBUFFERED=1
      - SQLITE_DB_PATH=/app/history.db
      - CHROMA_PERSIST_DIR=/app/models/chroma_db
      - HF_HOME=/opt/models_cache/hf_home
      - TRANSFORMERS_CACHE=/opt/models_cache/transformers
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
