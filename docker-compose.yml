services:
  resume-matcher:
    container_name: resume-matcher-app
    build:
      context: .
      dockerfile: Dockerfile
    image: resume-matcher:latest
    ports:
      - "8501:8501"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # Mount data and models for persistence across container lifecycles
      - ./data:/app/data
      - ./models:/app/models
      - ./history.db:/app/history.db
    environment:
      - PYTHONUNBUFFERED=1
      - SQLITE_DB_PATH=/app/history.db
      - CHROMA_PERSIST_DIR=/app/models/chroma_db
      - TRANSFORMERS_CACHE=/app/models/transformers_cache
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
